<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kontak Kami</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
    }

    h1 {
      text-align: center;
      color: #188038;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .contact-box {
      background: #f1f8f3;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .contact-box h3 {
      margin: 0 0 8px;
      color: #188038;
      font-size: 17px;
    }

    .contact-box p {
      margin: 0;
      font-size: 15px;
      word-break: break-word;
    }

    .whatsapp {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #188038;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.2s;
    }

    .whatsapp:hover {
      background: #137333;
    }

    .form-container {
      margin-top: 35px;
      padding-top: 30px;
      border-top: 2px solid #eeeeee;
    }

    .form-container h2 {
      text-align: center;
      color: #188038;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #188038;
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    #btnKirim {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #188038;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #btnKirim:hover {
      background: #137333;
    }

    #btnKirim:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      min-height: 25px;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 10px;
      }

      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- JUDUL -->
    <h1>📞 Kontak Kami</h1>

    <p class="subtitle">
      Silakan hubungi kami melalui informasi berikut.
    </p>


    <!-- INFORMASI KONTAK -->

    <div class="contact-box">
      <h3>👤 Nama</h3>
      <p>Cinta Sandrayana</p>
    </div>


    <div class="contact-box">
      <h3>📱 Nomor Telepon</h3>
      <p>0822-5683-1797</p>
    </div>


    <div class="contact-box">
      <h3>📧 Email</h3>
      <p>sandrayanacinta198@gmail.com</p>
    </div>


    <div class="contact-box">
      <h3>📍 Alamat</h3>
      <p>Serunai, Kalimantan Barat</p>
    </div>


    <!-- WHATSAPP -->

    <a
      class="whatsapp"
      href="https://wa.me/6282256831797"
      target="_blank"
      rel="noopener noreferrer">

      💬 Hubungi via WhatsApp

    </a>


    <!-- FORM PESAN -->

    <div class="form-container">

      <h2>💬 Kirim Pesan</h2>


      <div class="form-group">

        <label for="nama">
          Nama
        </label>

        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama Anda"
        >

      </div>


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email Anda"
        >

      </div>


      <div class="form-group">

        <label for="pesan">
          Pesan
        </label>

        <textarea
          id="pesan"
          placeholder="Tulis pesan Anda..."
        ></textarea>

      </div>


      <!-- TOMBOL KIRIM -->

      <button
        type="button"
        id="btnKirim"
        onclick="kirimPesan()">

        📤 Kirim Pesan

      </button>


      <!-- STATUS -->

      <div id="status"></div>

    </div>


    <!-- FOOTER -->

    <div class="footer">
      © 2026 Aplikasi Penjualan
    </div>

  </div>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwub531VZJwqkCha1XFOqyajj28OOAbCJ45i0YZU4cBtBE8i2wdGrUFy8UuWN1yMLgB/exec";


function kirimPesan() {

  const nama =
    document.getElementById("nama").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const pesan =
    document.getElementById("pesan").value.trim();

  const status =
    document.getElementById("status");

  const tombol =
    document.getElementById("btnKirim");


  // ==========================================
  // VALIDASI
  // ==========================================

  if (nama === "") {

    status.innerHTML =
      "⚠️ Nama wajib diisi.";

    status.style.color =
      "red";

    return;
  }


  if (email === "") {

    status.innerHTML =
      "⚠️ Email wajib diisi.";

    status.style.color =
      "red";

    return;
  }


  if (pesan === "") {

    status.innerHTML =
      "⚠️ Pesan wajib diisi.";

    status.style.color =
      "red";

    return;
  }


  // ==========================================
  // LOADING
  // ==========================================

  status.innerHTML =
    "⏳ Sedang mengirim pesan...";

  status.style.color =
    "#188038";

  tombol.disabled =
    true;

  tombol.innerHTML =
    "⏳ Mengirim...";


  // ==========================================
  // BUAT NAMA CALLBACK
  // ==========================================

  const callbackName =
    "callbackPesan_" +
    Date.now();


  // ==========================================
  // FUNGSI CALLBACK
  // ==========================================

  window[callbackName] =
    function(response) {

      console.log(
        "Respon Apps Script:",
        response
      );


      // ========================================
      // BERHASIL
      // ========================================

      if (
        response &&
        response.success === true
      ) {

        status.innerHTML =
          "✅ " +
          response.message;

        status.style.color =
          "#188038";


        // Kosongkan form

        document.getElementById(
          "nama"
        ).value = "";

        document.getElementById(
          "email"
        ).value = "";

        document.getElementById(
          "pesan"
        ).value = "";

      }


      // ========================================
      // GAGAL
      // ========================================

      else {

        status.innerHTML =
          "❌ " +
          (
            response &&
            response.message
              ? response.message
              : "Pesan gagal dikirim."
          );

        status.style.color =
          "red";

      }


      // Aktifkan tombol

      tombol.disabled =
        false;

      tombol.innerHTML =
        "📤 Kirim Pesan";


      // Hapus callback

      delete window[callbackName];

    };


  // ==========================================
  // BUAT URL
  // ==========================================

  const url =
    WEB_APP_URL +

    "?action=kirimPesan" +

    "&nama=" +
    encodeURIComponent(nama) +

    "&email=" +
    encodeURIComponent(email) +

    "&pesan=" +
    encodeURIComponent(pesan) +

    "&callback=" +
    callbackName;


  console.log(
    "URL REQUEST:",
    url
  );


  // ==========================================
  // KIRIM DENGAN JSONP
  // ==========================================

  const script =
    document.createElement("script");


  script.src =
    url;


  script.async =
    true;


  // ==========================================
  // ERROR
  // ==========================================

  script.onerror =
    function() {

      status.innerHTML =
        "❌ Tidak dapat menghubungi Google Apps Script.";

      status.style.color =
        "red";


      tombol.disabled =
        false;

      tombol.innerHTML =
        "📤 Kirim Pesan";


      delete window[callbackName];

    };


  // ==========================================
  // JALANKAN REQUEST
  // ==========================================

  document.body.appendChild(
    script
  );

}

</script>

</html>
