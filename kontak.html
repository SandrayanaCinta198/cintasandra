<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwub531VZJwqkCha1XFOqyajj28OOAbCJ45i0YZU4cBtBE8i2wdGrUFy8UuWN1yMLgB/exec";


function kirimPesan() {

  const nama =
    document.getElementById("nama").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const pesan =
    document.getElementById("pesan").value.trim();

  const status =
    document.getElementById("status");

  const tombol =
    document.getElementById("btnKirim");


  // VALIDASI

  if (nama === "") {
    status.innerHTML = "⚠️ Nama wajib diisi.";
    status.style.color = "red";
    return;
  }

  if (email === "") {
    status.innerHTML = "⚠️ Email wajib diisi.";
    status.style.color = "red";
    return;
  }

  if (pesan === "") {
    status.innerHTML = "⚠️ Pesan wajib diisi.";
    status.style.color = "red";
    return;
  }


  // TAMPILKAN LOADING

  status.innerHTML = "⏳ Mengirim pesan...";
  status.style.color = "#188038";

  tombol.disabled = true;
  tombol.innerHTML = "⏳ Mengirim...";


  // REQUEST

  const url =
    WEB_APP_URL +
    "?action=kirimPesan" +
    "&nama=" + encodeURIComponent(nama) +
    "&email=" + encodeURIComponent(email) +
    "&pesan=" + encodeURIComponent(pesan);


  fetch(url)
    .then(function(response) {

      return response.text();

    })

    .then(function(data) {

      console.log("RESPON APPS SCRIPT:", data);


      let hasil;

      try {

        hasil = JSON.parse(data);

      } catch (error) {

        throw new Error(
          "Server memberikan respon yang tidak valid."
        );

      }


      if (hasil.success) {

        status.innerHTML =
          "✅ " + hasil.message;

        status.style.color =
          "#188038";


        // Kosongkan form

        document.getElementById("nama").value = "";

        document.getElementById("email").value = "";

        document.getElementById("pesan").value = "";

      } else {

        status.innerHTML =
          "❌ " + hasil.message;

        status.style.color =
          "red";
      }

    })

    .catch(function(error) {

      console.error(error);

      status.innerHTML =
        "❌ Gagal mengirim pesan: " +
        error.message;

      status.style.color =
        "red";

    })

    .finally(function() {

      tombol.disabled = false;

      tombol.innerHTML =
        "📤 Kirim Pesan";

    });

}

</script>
