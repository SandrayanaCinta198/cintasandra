<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      margin: 0;
      padding: 50px;
    }

    .container {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #188038;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .contact-box {
      background: #f1f8f3;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    .contact-box h3 {
      margin: 0 0 8px 0;
      color: #188038;
    }

    .contact-box p {
      margin: 0;
      color: #333;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #188038;
      color: white;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      margin-top: 25px;
      font-size: 16px;
    }

    .whatsapp:hover {
      background: #137333;
    }

    /* FORM PESAN */
    .contact-form {
      margin-top: 35px;
      padding-top: 30px;
      border-top: 2px solid #eee;
    }

    .contact-form h2 {
      text-align: center;
      color: #188038;
      margin-bottom: 25px;
    }

    .contact-form label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: #188038;
    }

    .contact-form textarea {
      resize: vertical;
    }

    .contact-form button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #188038;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .contact-form button:hover {
      background: #137333;
    }

    .contact-form button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #888;
      font-size: 13px;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>📞 Kontak Kami</h1>

    <p class="subtitle">
      Silakan hubungi kami melalui informasi berikut.
    </p>

    <!-- INFORMASI KONTAK -->

    <div class="contact-box">
      <h3>👤 Nama</h3>
      <p>Cinta Sandrayana</p>
    </div>

    <div class="contact-box">
      <h3>📱 Nomor Telepon</h3>
      <p>0822-5683-1797</p>
    </div>

    <div class="contact-box">
      <h3>📧 Email</h3>
      <p>sandrayanacinta198@gmail.com</p>
    </div>

    <div class="contact-box">
      <h3>📍 Alamat</h3>
      <p>Serunai, Kalimantan Barat</p>
    </div>

    <!-- WHATSAPP -->

    <a
      class="whatsapp"
      href="https://wa.me/6282256831797"
      target="_blank">
      💬 Hubungi via WhatsApp
    </a>


    <!-- FORM KIRIM PESAN -->

    <div class="contact-form">

      <h2>💬 Kirim Pesan</h2>

      <form id="formPesan">

        <label for="nama">Nama</label>

        <input
          type="text"
          id="nama"
          placeholder="Masukkan nama Anda"
          required
        >


        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email Anda"
          required
        >


        <label for="pesan">Pesan</label>

        <textarea
          id="pesan"
          placeholder="Tulis pesan Anda..."
          rows="6"
          required
        ></textarea>


        <button type="submit" id="btnKirim">
          📤 Kirim Pesan
        </button>

      </form>

      <p id="status"></p>

    </div>


    <div class="footer">
      © 2026 Aplikasi Penjualan
    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script>

    document
      .getElementById("formPesan")
      .addEventListener("submit", function(e) {

        e.preventDefault();

        const nama =
          document.getElementById("nama").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const pesan =
          document.getElementById("pesan").value.trim();

        const status =
          document.getElementById("status");

        const tombol =
          document.getElementById("btnKirim");


        // Cek data

        if (!nama || !email || !pesan) {

          status.innerHTML =
            "⚠️ Semua kolom wajib diisi.";

          status.style.color = "red";

          return;
        }


        // Ubah status

        status.innerHTML =
          "⏳ Mengirim pesan...";

        status.style.color = "#188038";

        tombol.disabled = true;

        tombol.innerHTML =
          "⏳ Mengirim...";
<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwub531VZJwqkCha1XFOqyajj28OOAbCJ45i0YZU4cBtBE8i2wdGrUFy8UuWN1yMLgB/exec";


document
  .getElementById("formPesan")
  .addEventListener("submit", function(e) {

    e.preventDefault();


    const nama =
      document.getElementById("nama").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const pesan =
      document.getElementById("pesan").value.trim();

    const status =
      document.getElementById("status");

    const tombol =
      document.getElementById("btnKirim");


    if (!nama || !email || !pesan) {

      status.innerHTML =
        "⚠️ Semua kolom wajib diisi.";

      return;
    }


    status.innerHTML =
      "⏳ Mengirim pesan...";

    tombol.disabled = true;


    // Membuat nama fungsi callback unik

    const callbackName =
      "hasilPesan_" + Date.now();


    window[callbackName] =
      function(response) {

        if (response.success) {

          status.innerHTML =
            "✅ " + response.message;

          document
            .getElementById("formPesan")
            .reset();

        } else {

          status.innerHTML =
            "❌ " + response.message;

        }


        tombol.disabled = false;


        // Hapus callback

        delete window[callbackName];

      };


    // Membuat URL pengiriman

    const url =
      WEB_APP_URL +
      "?action=kirimPesan" +
      "&nama=" + encodeURIComponent(nama) +
      "&email=" + encodeURIComponent(email) +
      "&pesan=" + encodeURIComponent(pesan) +
      "&callback=" + callbackName;


    // Kirim ke Apps Script

    const script =
      document.createElement("script");

    script.src = url;


    script.onerror = function() {

      status.innerHTML =
        "❌ Gagal menghubungi server.";

      tombol.disabled = false;

      delete window[callbackName];

    };


    document.body.appendChild(script);

  });

</script>

       
  </script>

</body>
</html>
