<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Desa Serunai</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="icon"
          type="image/jpeg"
          href="favicon.jpeg">



</head>

<body>


<nav class="navbar">

    <div class="nav-container">

        <a href="index.html"
           class="logo">

            🌿 Desa <span>Serunai</span>

        </a>


        <div class="menu-button"
             onclick="toggleMenu()">

            ☰

        </div>


        <ul class="nav-menu"
            id="navMenu">

            <li>
                <a href="index.html">
                    Beranda
                </a>
            </li>

            <li>
                <a href="tentang.html">
                    Tentang Desa
                </a>
            </li>

            <li>
                <a href="wisata.html">
                    Wisata
                </a>
            </li>

            <li>
                <a href="galeri.html">
                    Galeri
                </a>
            </li>

            <li>
                <a href="kontak.html">
                    Kontak
                </a>
            </li>

            <li>
                <a href="admin.html"
                   class="active">
                    Admin
                </a>
            </li>

        </ul>

    </div>

</nav>


<section class="container">


    <!-- LOGIN -->

    <div id="loginBox"
         class="contact-form"
         style="max-width:500px;margin:auto;">

        <div class="section-title">

            <h2>Admin Login</h2>

            <p>
                Masuk untuk melihat pesan.
            </p>

        </div>


        <form onsubmit="loginAdmin(event)">


            <div class="form-group">

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Username"
                    required>

            </div>


            <div class="form-group">

                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required>

            </div>


            <button
                type="submit"
                class="btn">

                Login

            </button>


            <div
                id="loginStatus"
                class="status">
            </div>


        </form>

    </div>


    <!-- ADMIN PANEL -->

    <div id="adminPanel"
         style="display:none;">


        <div class="admin-header">

            <div>

                <h2>
                    🌿 Dashboard Admin
                </h2>

                <p>
                    Data pesan dari pengunjung.
                </p>

            </div>


            <button
                class="btn"
                onclick="logoutAdmin()">

                Logout

            </button>

        </div>


        <div class="stats">


            <div class="stat-box">

                <span>
                    Total Pesan
                </span>

                <strong id="totalPesan">
                    0
                </strong>

            </div>


            <div class="stat-box">

                <span>
                    Status
                </span>

                <strong>
                    Aktif
                </strong>

            </div>


            <div class="stat-box">

                <span>
                    Database
                </span>

                <strong>
                    Sheets
                </strong>

            </div>


        </div>


        <br>


        <div class="admin-card">

            <div class="table-wrapper">

                <table class="admin-table">

                    <thead>

                        <tr>

                            <th>
                                Tanggal
                            </th>

                            <th>
                                Nama
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Subjek
                            </th>

                            <th>
                                Pesan
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="dataPesan">

                        <tr>

                            <td colspan="6"
                                style="text-align:center">

                                Silakan login.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </div>

</section>


<footer>

    <p>
        © 2026 Desa Serunai
    </p>

</footer>


<script src="script.js"></script>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            cekAdmin();

        }
    );

</script>


</body>

</html>
